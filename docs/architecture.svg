<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Segoe UI, Arial, sans-serif">
<rect width="920" height="560" fill="#0b1f3a"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#ffffff">SENTINEL — fail-safe cardiac telemetry</text>
<text x="40" y="70" font-size="14" fill="#8fa6c0">Dual-core real-time architecture · ESP32-S3 · FreeRTOS</text>

<!-- Core 1 lane -->
<rect x="40" y="96" width="580" height="360" rx="16" fill="none" stroke="#0f6e56" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="58" y="122" font-size="15" font-weight="600" fill="#3fd6b0">Core 1 — real-time plane (APP_CPU)</text>

<!-- pipeline boxes -->
<rect x="70" y="150" width="230" height="52" rx="9" fill="#0f3a34" stroke="#12a58a"/>
<text x="185" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#d7fff4">ECG sampler</text>
<text x="185" y="193" text-anchor="middle" font-size="11" fill="#7fd8c6">20 Hz · prio 8</text>

<rect x="70" y="234" width="230" height="52" rx="9" fill="#0f3a34" stroke="#12a58a"/>
<text x="185" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#d7fff4">Arrhythmia detector</text>
<text x="185" y="277" text-anchor="middle" font-size="11" fill="#7fd8c6">R-peak + RR check · prio 8</text>

<rect x="70" y="318" width="230" height="52" rx="9" fill="#3a2f10" stroke="#b98a1e"/>
<text x="185" y="344" text-anchor="middle" font-size="15" font-weight="600" fill="#ffe9b8">Coordinator</text>
<text x="185" y="361" text-anchor="middle" font-size="11" fill="#e0c17e">event-group rendezvous · prio 9</text>

<rect x="70" y="392" width="230" height="46" rx="9" fill="#3a1220" stroke="#c0392b"/>
<text x="185" y="415" text-anchor="middle" font-size="15" font-weight="600" fill="#ffd7dd">Alarm dispatch</text>
<text x="185" y="431" text-anchor="middle" font-size="11" fill="#e79aa4">task notification · prio 12</text>

<!-- arrows down the pipeline -->
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="185" y1="202" x2="185" y2="232" stroke="#9fb3c8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="196" y="221" font-size="11" fill="#9fb3c8">queue · depth 8</text>
<line x1="185" y1="286" x2="185" y2="316" stroke="#9fb3c8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="196" y="305" font-size="11" fill="#9fb3c8">event bits P+D</text>
<line x1="185" y1="370" x2="185" y2="390" stroke="#9fb3c8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="196" y="384" font-size="11" fill="#9fb3c8">notify</text>

<!-- watchdog -->
<rect x="350" y="234" width="240" height="130" rx="10" fill="#122a4a" stroke="#4f86c6"/>
<text x="470" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#cfe4ff">Freshness watchdog</text>
<text x="470" y="281" text-anchor="middle" font-size="11" fill="#9dc2ec">10 Hz deadline check · prio 11</text>
<text x="470" y="305" text-anchor="middle" font-size="11" fill="#9dc2ec">age &gt; 300 ms  =&gt;  fail safe</text>
<text x="470" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#ff8fa3">NORMAL  &#8644;  DEGRADED</text>
<text x="470" y="346" text-anchor="middle" font-size="11" fill="#9dc2ec">persistent ALARM on sensor loss</text>

<!-- detector feeds watchdog freshness -->
<line x1="300" y1="260" x2="348" y2="285" stroke="#4f86c6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="300" y="250" font-size="10" fill="#7fa8d8">last-sample time</text>

<!-- button fault injection -->
<rect x="350" y="392" width="240" height="46" rx="9" fill="#26313f" stroke="#7d8a99"/>
<text x="470" y="415" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf5">Button ISR — inject sensor fault</text>
<text x="470" y="431" text-anchor="middle" font-size="11" fill="#aab7c6">toggles sampler on/off (demo trigger)</text>
<line x1="470" y1="392" x2="470" y2="368" stroke="#7d8a99" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="350" y1="410" x2="185" y2="410" stroke="#7d8a99" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="185" y1="410" x2="185" y2="438" stroke="#7d8a99" stroke-width="0" />

<!-- Core 0 lane -->
<rect x="650" y="96" width="230" height="360" rx="16" fill="none" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="668" y="122" font-size="15" font-weight="600" fill="#6fb0f0">Core 0 — observability (PRO_CPU)</text>
<rect x="676" y="180" width="178" height="180" rx="10" fill="#0e2a4d" stroke="#2f7fd0"/>
<text x="765" y="208" text-anchor="middle" font-size="15" font-weight="600" fill="#d6ecff">Monitor</text>
<text x="765" y="234" text-anchor="middle" font-size="11" fill="#9dc2ec">serial or web (HTTP)</text>
<text x="765" y="258" text-anchor="middle" font-size="11" fill="#9dc2ec">system STATE</text>
<text x="765" y="278" text-anchor="middle" font-size="11" fill="#9dc2ec">queue depth · event bits</text>
<text x="765" y="298" text-anchor="middle" font-size="11" fill="#9dc2ec">per-task heartbeats</text>
<text x="765" y="318" text-anchor="middle" font-size="11" fill="#9dc2ec">measured WCET</text>
<text x="765" y="338" text-anchor="middle" font-size="11" fill="#9dc2ec">degrade events</text>

<!-- monitor reads plane -->
<line x1="620" y1="276" x2="674" y2="270" stroke="#2f7fd0" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="612" y="300" text-anchor="end" font-size="10" fill="#7fa8d8">reads shared state</text>

<!-- legend -->
<text x="40" y="500" font-size="12" fill="#8fa6c0">Legend:</text>
<rect x="98" y="490" width="14" height="12" fill="#0f3a34" stroke="#12a58a"/><text x="118" y="500" font-size="12" fill="#c7d6e6">data plane</text>
<rect x="196" y="490" width="14" height="12" fill="#3a2f10" stroke="#b98a1e"/><text x="216" y="500" font-size="12" fill="#c7d6e6">control</text>
<rect x="278" y="490" width="14" height="12" fill="#3a1220" stroke="#c0392b"/><text x="298" y="500" font-size="12" fill="#c7d6e6">alarm</text>
<rect x="352" y="490" width="14" height="12" fill="#122a4a" stroke="#4f86c6"/><text x="372" y="500" font-size="12" fill="#c7d6e6">safety / watchdog</text>
<text x="40" y="532" font-size="11" fill="#66788f">IPC: queue (FIFO) · event group (rendezvous) · task notification (1-to-1) — one primitive per hop.</text>
</svg>
